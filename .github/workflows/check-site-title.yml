name: Check site title

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'packages/web/index.html'
      - 'packages/web/src/web/app.tsx'
      - '.github/workflows/check-site-title.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Verify title metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('packages/web/index.html').read_text()
          if '<title>Flutter Releases | downloads, notes, channels</title>' not in html:
              raise SystemExit('index.html title is not SEO-friendly')
          app = Path('packages/web/src/web/app.tsx').read_text()
          if 'document.title = "Flutter Releases | downloads, notes, channels";' not in app:
              raise SystemExit('App title is not set at runtime')
          print('title ok')
          PY
