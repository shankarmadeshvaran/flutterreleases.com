name: Generate feed and sitemap

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'packages/web/public/releases.json'
      - 'scripts/**'
      - '.github/workflows/update-releases.yml'
      - 'package.json'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-feed-and-sitemap
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Run generator (build feed.xml, sitemap.xml)
        run: node scripts/generate-releases.js

      - name: Validate generated output
        id: validate
        run: |
          if [ ! -f packages/web/public/feed.xml ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "reason=no_feed" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ ! -f packages/web/public/sitemap.xml ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "reason=no_sitemap" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: Commit & push generated files
        if: steps.validate.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/public/feed.xml packages/web/public/sitemap.xml packages/web/public/generation_status.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(generator): update feed, sitemap and release data"
            git stash || true
            git pull --rebase
            git stash pop || true
            git push
          else
            echo "No changes to commit"
          fi
