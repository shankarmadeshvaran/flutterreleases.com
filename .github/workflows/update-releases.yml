name: Update releases

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-releases
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }} # set this in repository secrets to your canonical site URL
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run generator
        run: node scripts/generate-releases.js

      - name: Validate generated output
        id: validate
        run: |
          if [ ! -f public/releases.json ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "reason=no_file" >> $GITHUB_OUTPUT
            exit 0
          fi
          ITEMS=$(jq '.items | length' public/releases.json)
          echo "items=$ITEMS"
          if [ "$ITEMS" -eq 0 ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "reason=zero_items" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: Commit & push generated files
        if: steps.validate.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage generated outputs
          git add public/releases.json public/feed.xml public/sitemap.xml public/data/releases.generated.json public/generation_status.json || true
          # Only commit if there are staged changes
          if ! git diff --staged --quiet; then
            git commit -m "chore(generator): update generated release data"
            git push
          else
            echo "No changes to commit"
          fi