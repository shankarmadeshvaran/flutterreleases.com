name: Crawl Flutter Releases

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch: {}    # manual trigger from GitHub UI

permissions:
  contents: write
  deployments: write

concurrency:
  group: crawl-releases
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/crawl-releases.js --all-channels

      - name: Commit updated releases.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/public/releases.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(crawler): auto-update Flutter releases"
            git stash || true
            git pull --rebase
            git stash pop || true
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No new releases found. Nothing to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate releases.json
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path('packages/web/public/releases.json')
          d = json.loads(p.read_text())
          items = d.get('items', d) if isinstance(d, dict) else d
          if len(items) < 50:
              sys.exit(f'releases.json has only {len(items)} items — aborting deploy')
          print(f'releases.json OK: {len(items)} items')
          PY

      - name: Build web
        run: bun run build:web
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID || vars.VITE_GA_MEASUREMENT_ID }}

      - name: Generate per-release static pages + sitemap + llms-full.txt
        run: node scripts/generate-release-pages.js
        env:
          SITE_URL: https://flutterreleases.com

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy packages/web/dist --project-name=flutterreleases --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
