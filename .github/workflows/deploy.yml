name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate releases.json
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path('packages/web/public/releases.json')
          if not p.exists():
              sys.exit('releases.json missing — aborting deploy')
          d = json.loads(p.read_text())
          items = d.get('items', d) if isinstance(d, dict) else d
          if len(items) < 50:
              sys.exit(f'releases.json has only {len(items)} items — aborting deploy (stale data)')
          if 'version' not in items[0]:
              sys.exit(f'releases.json missing "version" key (got: {list(items[0].keys())[:4]}) — wrong schema')
          print(f'releases.json OK: {len(items)} items, schema valid')
          PY

      - name: Build web
        run: bun run build:web
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID || vars.VITE_GA_MEASUREMENT_ID }}

      - name: Generate per-release static pages + sitemap + llms-full.txt
        run: node scripts/generate-release-pages.js
        env:
          SITE_URL: https://flutterreleases.com

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy packages/web/dist --project-name=flutterreleases --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
