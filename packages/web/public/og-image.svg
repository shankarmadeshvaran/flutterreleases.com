      <polygon points="85,78 137,78 65,150 39,124" fill="#29b6f6"/>
      <polygon points="65,150 91,124 137,170 85,170" fill="#01579b"/>
    </g>
    <text x="86" y="36" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">Flutter Releases</text>
    <text x="86" y="72" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">flutterreleases.com</text>
  </g>

  <g transform="translate(130 276)">
    <text font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="800" fill="#f8fafc">
      <tspan x="0" y="0">Flutter versions,</tspan>
      <tspan x="0" y="74">Dart compatibility</tspan>
    </text>
    <text x="0" y="118" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="500" fill="#cbd5e1">Downloads, release notes, channels, and SDK history in one place.</text>
  </g>

  <g transform="translate(130 492)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">
