<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Flutter Releases social preview</title>
  <desc id="desc">FlutterReleases.com preview image for Flutter versions, Dart SDK compatibility, downloads, and release notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#0b3149"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="990" cy="92" r="260" fill="url(#glow)"/>
  <circle cx="252" cy="570" r="260" fill="#0ea5e9" opacity="0.09"/>
  <path d="M0 520 C180 440 260 455 430 504 C610 556 760 584 1200 430 L1200 630 L0 630 Z" fill="#38bdf8" opacity="0.08"/>

  <g transform="translate(82 76)" filter="url(#shadow)">
    <rect width="1036" height="478" rx="34" fill="#0b1220" opacity="0.82"/>
    <rect x="1" y="1" width="1034" height="476" rx="33" fill="none" stroke="#1f3a4b"/>
  </g>

  <g transform="translate(130 126)">
    <g transform="scale(0.48)">
