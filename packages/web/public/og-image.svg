    <text x="24" y="-2" fill="#86efac">Stable</text>
    <rect x="164" y="-30" width="120" height="44" rx="22" fill="#78350f"/>
    <text x="190" y="-2" fill="#fcd34d">Beta</text>
    <rect x="300" y="-30" width="210" height="44" rx="22" fill="#0c4a6e"/>
    <text x="326" y="-2" fill="#7dd3fc">Dart SDK</text>
